services:
  musicdl-webui:
    image: ghcr.io/agonie0v0/musicdl:latest
    restart: unless-stopped
    init: true
    ports:
      - "8765:8765"
    volumes:
      - ./music:/music
      - ./data:/data
    environment:
      MUSICDL_USER: admin
      MUSICDL_PASS: '请改成你自己的密码'
      # 将 192.168.1.100 改为运行本服务的电脑或服务器 IP
      MUSICDL_TRUSTED_HOSTS: 'localhost,127.0.0.1,192.168.1.100'
