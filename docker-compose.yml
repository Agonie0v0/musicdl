# NAS / 服务器一键部署：docker compose up -d，然后访问 http://<主机IP>:8765
#
# 关键点：把下载目录 (/music) 挂到 navidrome 的音乐库同一个宿主机文件夹，
# musicdl 下好的歌会以 “音源/歌名.ext” 平铺进去，navidrome 扫描即入库。
services:
  musicdl-webui:
    build: .
    # image: ghcr.io/sagirixr/musicdl-webui:latest   # 若日后发布镜像可直接用
    container_name: musicdl-webui
    restart: unless-stopped
    ports:
      - "8765:8765"
    volumes:
      - ./music:/music        # 下载目录（=navidrome 音乐库，见下方）
      - ./data:/data          # 保存 config.json（音源/Cookie/代理等设置）
    environment:
      - MUSICDL_WORKDIR=/music
      - MUSICDL_CONFIG=/data/config.json
      # - HTTP_PROXY=http://host.docker.internal:7890   # 需要代理时打开

  # —— 可选：同一个 ./music 目录挂给 navidrome，下载即入库 ——
  # navidrome:
