# 默认本机访问：http://127.0.0.1:8765；远程访问配置见 README。
#
# 关键点：把下载目录 (/music) 挂到 navidrome 的音乐库同一个宿主机文件夹，
# 下载文件按界面设置组织目录，navidrome 扫描同一音乐目录即可入库。
services:
  musicdl-webui:
    image: ghcr.io/agonie0v0/musicdl:latest
    pull_policy: always
    restart: unless-stopped
    init: true
    ports:
      - "${MUSICDL_BIND:-127.0.0.1}:${MUSICDL_HOST_PORT:-8765}:8765"
    volumes:
      - ./music:/music        # 下载目录（=navidrome 音乐库，见下方）
      - ./data:/data          # 保存 SQLite 数据库（音源/Cookie/代理等设置）
    environment:
      MUSICDL_DOWNLOAD_DIR: /music
      MUSICDL_DATA_DIR: /data
      MUSICDL_CONFIG: /data/config.json
      MUSICDL_MAX_DOWNLOAD_TASKS: "${MUSICDL_MAX_DOWNLOAD_TASKS:-2}"
      MUSICDL_USER: "${MUSICDL_USER:?请在 .env 中设置 MUSICDL_USER}"
      MUSICDL_PASS: "${MUSICDL_PASS:?请在 .env 中设置 MUSICDL_PASS}"
      MUSICDL_TRUSTED_HOSTS: "${MUSICDL_TRUSTED_HOSTS:?请在 .env 中设置访问域名，并包含 localhost,127.0.0.1}"
      MUSICDL_COOKIE_SECURE: "${MUSICDL_COOKIE_SECURE:-0}"
      # HTTP_PROXY: http://host.docker.internal:7890   # 需要代理时打开
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=64m,mode=1777
    stop_grace_period: 30s

  # —— 可选：同一个 ./music 目录挂给 navidrome，下载即入库 ——
