name: Original engine and frontend checks
on:
  push:
  pull_request:
jobs:
  original-engine:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install -r requirements.txt pytest httpx
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: npm ci --prefix frontend
      - run: npm run build --prefix frontend
      - run: python -m pytest tests/test_engine_compat.py tests/test_resumable_download.py tests/test_search_runtime.py -q
      - run: python -m pytest tests/test_bot_notifications.py tests/test_bot_files_sources.py tests/test_error_messages.py -q
      - run: python -m pytest legacy/tests/test_app.py -q
      - run: python -m pytest tests/test_launcher.py tests/test_docker_entrypoint.py -q
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: npm ci
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
