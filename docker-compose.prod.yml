services:
  musicdl-webui:
    # 这里的 agonie0v0 是我根据你当前的项目空间猜测的用户名。如果不对，部署前请自行修改。
    image: ghcr.io/agonie0v0/musicdl-webui:latest
    container_name: musicdl-webui
    restart: unless-stopped
    ports:
      - "8765:8765"
    volumes:
      # 【注意】左侧路径请务必修改为你自己 NAS 上的真实路径
      - /volume1/music/musicdl:/music
      - /volume1/docker/musicdl/data:/data
    environment:
      - MUSICDL_WORKDIR=/music
      - MUSICDL_CONFIG=/data/config.json
      # 可选：如果希望开启网页登录验证，取消下方注释并设置账号密码
      # - MUSICDL_USER=admin
      # - MUSICDL_PASS=your_password
